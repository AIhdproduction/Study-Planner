# HSLU T&A code mapping.
# Maps foreign course codes from timetable, module directory, and MyCampus to curriculum codes.
#
# Matching rules:
# 1. Strip documented source-specific prefixes/suffixes to get the code stem:
#    - mycampus: trailing run suffix .<H|F><yy><run> (e.g. .H2601)
#    - module_directory: trailing version suffix .<nn> (e.g. .21)
#    - timetable: leading department and type prefix (e.g. DCA-K-, DCS-P-)
# 2. If the stem is identical to a curriculum code, it matches directly without an entry here.
# 3. Otherwise, an explicit entry below maps the stem.
#    Entries with curriculum_code: null indicate modules listed in the source but not part of this curriculum.

mappings:
  - source: timetable
    foreign_code: TA.BA_DATA1
    curriculum_code: TA.BA_DATA1_MM
    source_document: {document: "DCA Musterstundenplan Arch Teilzeit.pdf", page: 1}
    evidence: "Same module title in timetable and curriculum."
    verification_status: unverified

